# ld65 config for Microsoft BASIC on the bw-board 6502 machine:
# RAM $0000-$3FFF, ROM $8000-$FFFF, vectors at $FFFA.
# Output is a raw 32 KB ROM image loaded at $8000.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, define = yes;
    RAM: start = $0100, size = $3F00, type = rw, define = yes;
    ROM: start = $8000, size = $7FFA, type = ro, file = %O, fill = yes, fillval = $EA;
    VEC: start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    VECTORS:  load = VEC, type = ro;
}
